# Run everything:        dvc repro
# One stage:             dvc repro train@vit_flow
# Compare experiments:   dvc metrics show / dvc exp run --set-param configs/models/vit_flow.yaml:train.lr=5e-5
stages:
  extract_frames:
    foreach: [shanghaitech, manual]
    do:
      cmd: python -m src.data.extract_frames --dataset ${item}
      deps: ["src/data/extract_frames.py", "data/raw/${item}"]
      params: [extract]
      outs: ["data/interim/frames/${item}"]

  optical_flow:
    foreach: [shanghaitech, manual]
    do:
      cmd: >-
        python -m src.features.optical_flow --dataset ${item} --config configs/features/farneback.yaml
        && python -m src.features.direction --dataset ${item} --config configs/features/farneback.yaml
      deps: ["src/features/optical_flow.py", "src/features/direction.py", "data/interim/frames/${item}"]
      params:
        - configs/features/farneback.yaml:
      outs: ["data/features/farneback/${item}", "data/labels/farneback/${item}"]

  tracking:
    foreach: [shanghaitech, manual]
    do:
      cmd: python -m src.features.tracking --dataset ${item} --config configs/features/tracking.yaml
      deps: ["src/features/tracking.py", "data/interim/frames/${item}"]
      params:
        - configs/features/tracking.yaml:
      outs: ["data/features/tracking/${item}", "data/labels/tracking/${item}"]

  train:
    foreach: [vit_flow, convlstm_flow]
    do:
      cmd: python -m src.train --config configs/models/${item}.yaml
      deps: ["src/train.py", "src/models", "src/data/dataset.py", "data/features/farneback/shanghaitech",
             "data/labels/tracking/shanghaitech", "data/labels/farneback/shanghaitech"]
      params:
        - configs/models/${item}.yaml:
      outs:
        - models/${item}:
            persist: true      # keep older runs; each run has its own <run_id> folder

  evaluate:
    foreach: [vit_flow, convlstm_flow]
    do:
      cmd: >-
        python -m src.evaluate --model ${item} --dataset shanghaitech
        && python -m src.evaluate --model ${item} --dataset manual
      deps: ["src/evaluate.py", "models/${item}", "data/features/farneback/manual"]

  visualize:
    foreach: [vit_flow, convlstm_flow]
    do:
      cmd: python -m src.visualize --model ${item} --dataset manual --all
      deps: ["src/visualize.py", "models/${item}"]
      outs:
        - outputs/${item}:
            cache: false
