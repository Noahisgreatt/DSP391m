# DVC pipeline: `dvc dag` draws it, `dvc repro <stage>` runs a stage + everything it needs.
#   1 data      prepare_shanghaitech, prepare_manual, split                  (src/dataset/prepare.py)
#   2 behavior  behavior@shanghaitech, behavior@manual                        (src/behavior.py)
#   3 models    train@<model> for all four                                    (src/train.py)
#   4 evaluate  evaluate@<model>, compare, benchmark                          (src/evaluate.py)
# Versions v1.0, v1.1, v2.0 ...: python -m src.release (docs/versioning.md).
# cache: false = big but re-creatable, kept off the DVC remote. Small JSON / CSV results are
# committed to git, so `dvc metrics diff v1.0 v2.0` works.

stages:
  # ------------------------------------------------------------------ 1. data
  prepare_shanghaitech:
    cmd: python -m src.dataset prepare
    deps: [data/raw/shanghaitech, src/dataset/prepare.py]
    outs:
      - data/processed/shanghaitech: {cache: false}
    metrics:
      - data/metadata/shanghaitech.json: {cache: false}      # data card

  prepare_manual:
    cmd: python -m src.dataset manual
    deps: [data/raw/manual, src/dataset/prepare.py]
    params:
      - configs/data.yaml: [frames]
    outs:
      - data/processed/manual: {cache: false}
    metrics:
      - data/metadata/manual.json: {cache: false}

  split:
    cmd: python -m src.dataset split
    deps: [data/metadata/shanghaitech.json, src/dataset/prepare.py]   # the card changes exactly when the data does
    outs:
      - data/metadata/split.json: {cache: false}

  # ------------------------------------------------------------------ 2. behavior rules (no training)
  behavior:
    foreach: [shanghaitech, manual]
    do:
      cmd: python -m src.behavior --dataset ${item}
      deps: [data/metadata/split.json, "data/metadata/${item}.json", src/behavior.py, src/models/nets.py]
      params:
        - configs/behavior.yaml:
      outs:
        - data/features/tracking/${item}: {cache: false, persist: true}       # kept: a stopped run continues
        - data/features/optical_flow/${item}: {cache: false, persist: true}
        - data/features/normal_maps/${item}: {cache: false}
        - outputs/behavior/${item}/events: {cache: false}
      metrics:
        - outputs/behavior/${item}/metrics.json: {cache: false}

  # ------------------------------------------------------------------ 3. models
  # Long runs. Stopped? Run the same command again: it continues (persist keeps the files).
  train:
    foreach:
      astt_baseline: {code: src/models/astt.py}
      astt_improved: {code: src/models/astt.py}
      mulde: {code: src/models/mulde.py}
      mulde_improved: {code: src/models/mulde.py}
      astt_lite: {code: src/models/astt.py}                    # model 5 (model 6 uses its weights: no training)
    do:
      cmd: python -m src.train --config configs/${key}.yaml
      deps: [data/metadata/shanghaitech.json, data/metadata/split.json, "${item.code}", src/models/nets.py, src/train.py]
      params:
        - configs/${key}.yaml:                                       # every setting of that model
      outs:
        - outputs/training/${key}/model.pth: {persist: true}          # trained weights / density model
        - outputs/training/${key}/run.json: {cache: false, persist: true}
      metrics:
        - outputs/training/${key}/metrics.json: {cache: false, persist: true}

  # ------------------------------------------------------------------ 4. evaluation
  evaluate:
    foreach:                                                   # weights = whose trained model.pth it scores with
      astt_baseline: {code: src/models/astt.py, weights: astt_baseline}
      astt_improved: {code: src/models/astt.py, weights: astt_improved}
      mulde: {code: src/models/mulde.py, weights: mulde}
      mulde_improved: {code: src/models/mulde.py, weights: mulde_improved}
      astt_lite: {code: src/models/astt.py, weights: astt_lite}
      astt_lite_smooth: {code: src/models/astt.py, weights: astt_lite}   # model 6 = model 5 + smoothing
    do:
      cmd: python -m src.evaluate --config configs/${key}.yaml
      deps: ["outputs/training/${item.weights}/model.pth", data/metadata/split.json, "${item.code}", src/evaluate.py]
      params:
        - configs/${key}.yaml:
      outs:
        - outputs/evaluation/${key}/scores: {cache: false}
      metrics:
        - outputs/evaluation/${key}/metrics.json: {cache: false}
      plots:
        - outputs/evaluation/${key}/roc.csv: {cache: false}

  compare:
    cmd: python -m src.evaluate --compare
    deps:
      - outputs/evaluation/astt_baseline/metrics.json
      - outputs/evaluation/astt_improved/metrics.json
      - outputs/evaluation/mulde/metrics.json
      - outputs/evaluation/mulde_improved/metrics.json
      - outputs/evaluation/astt_lite/metrics.json
      - outputs/evaluation/astt_lite_smooth/metrics.json
      - outputs/behavior/shanghaitech/metrics.json
      - src/evaluate.py
    outs:
      - outputs/comparison/comparison.md: {cache: false}
      - outputs/comparison/roc.png: {cache: false}
    metrics:
      - outputs/comparison/comparison.json: {cache: false}

  benchmark:
    cmd: python -m src.evaluate --benchmark
    deps:
      - outputs/training/astt_baseline/model.pth
      - outputs/training/astt_improved/model.pth
      - outputs/training/mulde/model.pth
      - outputs/training/mulde_improved/model.pth
      - outputs/training/astt_lite/model.pth
      - src/evaluate.py
    outs:
      - outputs/comparison/benchmark.md: {cache: false}
    metrics:
      - outputs/comparison/benchmark.json: {cache: false}

plots:                                     # dvc plots show / dvc plots diff v1.0 v2.0
  - ROC on the test videos:
      x: fpr
      y:
        outputs/evaluation/astt_baseline/roc.csv: tpr
        outputs/evaluation/astt_improved/roc.csv: tpr
        outputs/evaluation/mulde/roc.csv: tpr
        outputs/evaluation/mulde_improved/roc.csv: tpr
        outputs/evaluation/astt_lite/roc.csv: tpr
        outputs/evaluation/astt_lite_smooth/roc.csv: tpr

artifacts:                                 # model registry: what each trained model is
  astt-baseline:
    path: outputs/training/astt_baseline/model.pth
    type: model
    desc: "Model 1: thesis ASTT (STE + TTE + cross-attention), unchanged, trained from scratch, 150.6M"
    labels: [video-anomaly-detection, shanghaitech, thesis, baseline]
  astt-improved:
    path: outputs/training/astt_improved/model.pth
    type: model
    desc: "Model 2: improved ASTT (pretrained ViT, spatial tokens, residual prediction), 100.4M"
    labels: [video-anomaly-detection, shanghaitech, transfer-learning]
  mulde:
    path: outputs/training/mulde/model.pth
    type: model
    desc: "Model 3: MULDE (CVPR 2024) density model on Hiera-B video features, 70.7M"
    labels: [video-anomaly-detection, shanghaitech, density-estimation, baseline]
  mulde-improved:
    path: outputs/training/mulde_improved/model.pth
    type: model
    desc: "Model 4: MULDE improved (two clip lengths, per-camera mixtures, lighter density network), 58.1M"
    labels: [video-anomaly-detection, shanghaitech, density-estimation, lightweight]
  astt-lite:
    path: outputs/training/astt_lite/model.pth
    type: model
    desc: "Model 5: ASTT lite (model 2 with the first 7 of 12 ViT blocks), 64.9M; model 6 = these weights + Gaussian smoothing of the score"
    labels: [video-anomaly-detection, shanghaitech, transfer-learning, lightweight]
