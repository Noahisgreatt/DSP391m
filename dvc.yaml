# DVC pipeline: `dvc dag` draws it, `dvc repro <stage>` runs a stage + everything it needs.
#   1 data      prepare_shanghaitech, prepare_manual, split                  (src/data.py)
#   2 behavior  tracking_*, optical_flow_*, behavior_*                        (src/behavior.py)
#   3 models    train@<model> for all four                                    (src/train.py)
#   4 evaluate  evaluate@<model>, compare, benchmark                          (src/evaluate.py)
# Versions (git tag + releases/<version>.json): docs/versioning.md.
# cache: false = big but re-creatable, kept off the DVC remote. Small JSON / CSV results are
# committed to git, so `dvc metrics diff v1.0 v2.0` works.

stages:
  # ------------------------------------------------------------------ 1. data
  prepare_shanghaitech:
    cmd: python -m src.data prepare
    deps: [data/raw/shanghaitech, src/data.py]
    params:
      - configs/data.yaml: [shanghaitech.kaggle_train, shanghaitech.kaggle_test]
    outs:
      - data/processed/shanghaitech: {cache: false}
    metrics:
      - data/metadata/shanghaitech.json: {cache: false}      # data card

  prepare_manual:
    cmd: python -m src.data manual
    deps: [data/raw/manual, src/data.py]
    params:
      - configs/data.yaml: [frames]
    outs:
      - data/processed/manual: {cache: false}
    metrics:
      - data/metadata/manual.json: {cache: false}

  split:
    cmd: python -m src.data split
    deps: [data/metadata/shanghaitech.json, src/data.py]   # the card changes exactly when the data does
    params:
      - configs/data.yaml: [shanghaitech.val_fraction, shanghaitech.seed]
    outs:
      - data/metadata/split.json: {cache: false}

  # ------------------------------------------------------------------ 2. behavior (no training)
  tracking:
    foreach: [shanghaitech, manual]
    do:
      cmd: python -m src.behavior track --dataset ${item}
      deps: [data/metadata/split.json, "data/metadata/${item}.json", src/behavior.py, src/models/nets.py]
      params:
        - configs/behavior.yaml: [frame_size, tracking]
      outs:
        - data/features/tracking/${item}:
            cache: false

  optical_flow:
    foreach: [shanghaitech, manual]
    do:
      cmd: python -m src.behavior flow --dataset ${item}
      deps: [data/metadata/split.json, "data/metadata/${item}.json", src/behavior.py]
      params:
        - configs/behavior.yaml: [frame_size, optical_flow]
      outs:
        - data/features/optical_flow/${item}: {cache: false}
        - data/features/normal_maps/${item}: {cache: false}

  behavior:
    foreach: [shanghaitech, manual]
    do:
      cmd: python -m src.behavior detect --dataset ${item}
      deps: ["data/features/tracking/${item}", "data/features/normal_maps/${item}", src/behavior.py]
      params:
        - configs/behavior.yaml: [counter_flow, loitering]
      outs:
        - outputs/behavior/${item}/events: {cache: false}
      metrics:
        - outputs/behavior/${item}/metrics.json: {cache: false}

  # ------------------------------------------------------------------ 3. models
  # Long runs. Stopped? Run the same command again: it continues (persist keeps the files).
  train:
    foreach:
      astt_baseline: {code: src/models/astt.py}
      astt_improved: {code: src/models/astt.py}
      aivad: {code: src/models/aivad.py}
      aivad_lite: {code: src/models/aivad.py}
    do:
      cmd: python -m src.train --config configs/${key}.yaml
      deps: [data/metadata/shanghaitech.json, data/metadata/split.json, "${item.code}", src/models/nets.py, src/train.py]
      params:
        - configs/${key}.yaml:                                       # every setting of that model
      outs:
        - outputs/training/${key}/model.pth: {persist: true}          # trained weights / density model
        - outputs/training/${key}/run.json: {cache: false, persist: true}
      metrics:
        - outputs/training/${key}/metrics.json: {cache: false, persist: true}

  # ------------------------------------------------------------------ 4. evaluation
  evaluate:
    foreach:
      astt_baseline: {code: src/models/astt.py}
      astt_improved: {code: src/models/astt.py}
      aivad: {code: src/models/aivad.py}
      aivad_lite: {code: src/models/aivad.py}
    do:
      cmd: python -m src.evaluate --config configs/${key}.yaml
      deps: ["outputs/training/${key}/model.pth", data/metadata/split.json, "${item.code}", src/evaluate.py]
      outs:
        - outputs/evaluation/${key}/scores: {cache: false}
      metrics:
        - outputs/evaluation/${key}/metrics.json: {cache: false}
      plots:
        - outputs/evaluation/${key}/roc.csv: {cache: false}

  compare:
    cmd: python -m src.evaluate --compare
    deps:
      - outputs/evaluation/astt_baseline/metrics.json
      - outputs/evaluation/astt_improved/metrics.json
      - outputs/evaluation/aivad/metrics.json
      - outputs/evaluation/aivad_lite/metrics.json
      - outputs/behavior/shanghaitech/metrics.json
      - src/evaluate.py
    outs:
      - outputs/comparison/comparison.md: {cache: false}
      - outputs/comparison/roc.png: {cache: false}
    metrics:
      - outputs/comparison/comparison.json: {cache: false}

  benchmark:
    cmd: python -m src.evaluate --benchmark
    deps:
      - outputs/training/astt_baseline/model.pth
      - outputs/training/astt_improved/model.pth
      - outputs/training/aivad/model.pth
      - outputs/training/aivad_lite/model.pth
      - src/evaluate.py
    outs:
      - outputs/comparison/benchmark.md: {cache: false}
    metrics:
      - outputs/comparison/benchmark.json: {cache: false}

plots:                                     # dvc plots show / dvc plots diff v1.0 v2.0
  - ROC on the test videos:
      x: fpr
      y:
        outputs/evaluation/astt_baseline/roc.csv: tpr
        outputs/evaluation/astt_improved/roc.csv: tpr
        outputs/evaluation/aivad/roc.csv: tpr
        outputs/evaluation/aivad_lite/roc.csv: tpr

artifacts:                                 # model registry: what each trained model is
  astt-baseline:
    path: outputs/training/astt_baseline/model.pth
    type: model
    desc: "Model 1: thesis ASTT (STE + TTE + cross-attention), unchanged, trained from scratch, 150.6M"
    labels: [video-anomaly-detection, shanghaitech, thesis, baseline]
  astt-improved:
    path: outputs/training/astt_improved/model.pth
    type: model
    desc: "Model 2: improved ASTT (pretrained ViT, spatial tokens, residual prediction), 100.4M"
    labels: [video-anomaly-detection, shanghaitech, transfer-learning]
  aivad:
    path: outputs/training/aivad/model.pth
    type: model
    desc: "Model 3: AI-VAD density model (networks: Faster R-CNN + FlowNet2 + FastPose + CLIP, 331.0M)"
    labels: [video-anomaly-detection, shanghaitech, interpretable, baseline]
  aivad-lite:
    path: outputs/training/aivad_lite/model.pth
    type: model
    desc: "Model 4: AI-VAD Lite density model (networks: Keypoint R-CNN + FlowNetC, 98.3M)"
    labels: [video-anomaly-detection, shanghaitech, interpretable, lightweight]
