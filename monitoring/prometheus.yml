# Prometheus: what to collect (scrape) and how often.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: vad-api                    # the FastAPI service (docker compose service "api")
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: vad-training               # train.py running on the host (WSL), port 8001
    static_configs:
      - targets: ["host.docker.internal:8001"]
