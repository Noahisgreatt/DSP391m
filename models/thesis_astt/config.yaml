# The thesis model, UNCHANGED. Every value below is the repo default
# (models/thesis_astt/original_repo/config.py: get_train_config + get_b16_config; train_val_UIT_ADrone_*.py).
#   python -m models.thesis_astt.train    --config models/thesis_astt/config.yaml
#   python -m models.thesis_astt.evaluate --run runs/thesis_astt/<run_id>
experiment:
  name: thesis_astt
  type: thesis_astt

data:
  # same split settings as crowdformer.yaml -> both models use the SAME videos
  split_mode: standard        # official Campus split: train videos / test videos
  normal_holdout: 0.15        # (only used by split_mode: auto)
  val_fraction: 0.0           # 0 = no validation, last epoch is used, all 107 test videos scored
  seed: 2020
  split_override: null
  image_size: 384             # --image-size 384
  num_frames: 4               # --num-frames 4 (time_step=4 in data_utils.DataLoader)

model:                        # get_b16_config
  patch_size: 16              # only used by the repo for naming; the STE is ViT-B/32 (timm)
  emb_dim: 768
  mlp_dim: 1536
  num_heads: 6
  num_layers: 2
  num_classes: 25             # --num-classes 25 (unused by the model)
  attn_dropout_rate: 0.0
  dropout_rate: 0.1

train:                        # get_train_config + train_val_UIT_ADrone_*.py
  epochs: 5                   # --epochs 5
  batch_size: 8               # --batch-size 8
  lr: 1.0e-4                  # --lr 1e-4, SGD momentum 0.9
  wd: 1.0e-4                  # --wd 1e-4
  warmup_steps: 500           # --warmup-steps 500
  train_steps: auto           # repo default 38000 (OneCycleLR total_steps). The repo crashes if
                              # epochs x batches > 38000, so auto = epochs x batches
  num_workers: 4              # repo DataLoader(num_workers=4)
  checkpoint_minutes: 20      # save resume.pth this often (not in the repo; lets you --resume)
  amp: false                  # the repo trains in fp32. true = bf16 (a deviation, ~2x faster)

eval:
  batch_size: 1               # repo test_all_scenes uses batch_size=1
