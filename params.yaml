# Shared settings for every pipeline stage.
# Scripts read this file by default; pass --config <file> to override parts of it
# (e.g. configs/features/farneback.yaml) without editing this one.

data:
  # ShanghaiTech already comes as frames: one folder per video
  shanghai_frames: data/raw/SHANGHAI/SHANGHAI_TRAIN/frames
  # Your manual videos (tracked by DVC)
  manual_videos: data/raw/manual
  # Where extracted frames of the manual videos go
  frames_dir: data/interim/frames
  # Where per-video feature files (.npz) go
  features_dir: data/features

frames:
  resize: [640, 360]          # [width, height]; null keeps the original size
  step: 1                     # keep every Nth frame (2 = half the frames)
  jpg_quality: 95
  video_exts: [.mp4, .avi, .mov, .mkv, .MP4, .AVI, .MOV, .MKV]

flow:
  method: farneback
  farneback:
    pyr_scale: 0.5
    levels: 3
    winsize: 15
    iterations: 3
    poly_n: 5
    poly_sigma: 1.2
  # Also save a downscaled dense flow field (float16). Useful as model input later,
  # but it costs disk: ~14 KB per frame at 640x360 with downscale 8.
  save_small_flow: false
  small_flow_downscale: 8

direction:
  grid: [8, 8]                # [rows, cols] of cells over the frame
  n_bins: 8                   # direction bins: 0=right 1=down-right 2=down 3=down-left 4=left 5=up-left 6=up 7=up-right
  min_magnitude: 1.0          # pixels/frame; slower pixels count as "not moving"
  min_moving_fraction: 0.02   # a cell needs this share of moving pixels to get a direction

tracking:
  model: yolo11s.pt           # n = fastest, s = good balance, m/l = more accurate, slower
  conf: 0.25                  # minimum detection confidence
  imgsz: 960                  # detection size; larger finds small/far people better
  tracker: bytetrack.yaml     # or botsort.yaml
  device: null                # null = GPU if available, else CPU; or 0, "cpu"
  # direction per person = movement of the box centre over `window` frames
  window: 8                   # ~0.3 s at 25 fps; larger = smoother, slower to react
  smooth: 5                   # moving-average over this many frames to remove box jitter
  min_speed: 0.4              # px/frame (in resized coordinates); slower = "standing"

detection:
  # Frame rate of the source frames. Manual videos read theirs from meta.json instead.
  # Check the real value for your ShanghaiTech copy; it sets how long "N seconds" is.
  fps:
    shanghai: 25
    manual: 30                # fallback only, if meta.json has no fps
  # Normal direction map: "prefix" = learn one map per camera scene from ALL its videos
  # (ShanghaiTech 01_002 and 01_0014 are both scene 01); "video" = one map per video
  # (use this for hand-held phone clips, where every video is a different view).
  scene_from:
    shanghai: prefix
    manual: video
  min_cell_samples: 30        # a cell needs this many moving frames to have a "normal" direction

  # ABNORMAL = doing something different from the crowd around you
  crowd_k: 6                  # compare with this many nearest moving people
  crowd_radius_boxes: 8       # ...within this many body heights
  min_crowd: 2                # need at least this many neighbours to judge "the crowd"
  crowd_consistency: 0.5      # 0..1; neighbours must mostly agree on a direction
  counter_angle_deg: 120      # angle to the crowd's direction that counts as "against"
  min_flow_consistency: 0.35  # fallback with no crowd nearby: scene's normal flow at that spot
                              # (two-way paths score low, so nobody is flagged there)
  fast_bh_per_s: 2.0          # "fast": body-heights per second (walking ~0.8, running ~2+)
  fast_ratio: 2.0             # ...and at least this many times the neighbours' speed
  counter_min_seconds: 0.8    # must keep it up this long to be flagged

  # LOITERING = staying inside a small area for a long time
  loiter_seconds: 10          # surveillance systems often use 30 s+; ShanghaiTech clips are short
  loiter_radius_boxes: 1.0    # "small area" radius, in multiples of the person's box height
  min_coverage: 0.7           # person must be visible for this share of the loiter window

run:
  workers: 4                 # parallel processes (one video per process)
  overwrite: false            # false = skip videos that already have output

visualize:
  fps: 25
  arrow_scale: 6.0            # grid mode: arrow length = mean speed (px/frame) * this
  track_arrow_scale: 12.0     # tracks mode: arrow length = person speed * this
  track_arrow_min: 18         # tracks mode: shortest arrow in pixels, so slow walkers stay visible
