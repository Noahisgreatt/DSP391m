# Model 4: AI-VAD Lite (ours). Same attributes and scoring as model 3, lighter networks and three
# additions for our target behaviours. Every change from configs/aivad.yaml is marked [CHANGE].
# Weights: python -m src.models.nets download aivad_lite
#   python -m src.train    --config configs/aivad_lite.yaml
#   python -m src.evaluate --config configs/aivad_lite.yaml

model:
  name: aivad_lite
  family: aivad
  features: extract
  objects: keypointrcnn        # [CHANGE] Keypoint R-CNN: people AND 17 keypoints in one pass
                               #          (replaces Faster R-CNN + AlphaPose: two networks)
  detector_conf: 0.5
  pose: keypointrcnn           # [CHANGE] keypoints from the same pass
  flow: flownetc               # [CHANGE] only FlowNet2's first network (FlowNetC, same weights)
  flow_size: [512, 320]        # [CHANGE] half the resolution
  appearance: none             # [CHANGE] no CLIP (not part of the ShanghaiTech score anyway)

scoring:
  attributes: [velocity, pose, relative_velocity]   # [CHANGE] + motion relative to the crowd
  gmm_components: 5
  calibration_percentile: 99.9
  smoothing_sigma: 7
  per_scene: true              # [CHANGE] one model of "normal" per camera (13 cameras differ)
  track_smoothing: 5           # [CHANGE] average a person's score over their last 5 frames

eval: {batch_size: 1}
train: {num_workers: 0, amp: false}
