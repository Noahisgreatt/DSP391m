method: farneback

# Optical flow is computed on a downscaled grayscale frame, then stored at `store_size`.
# 112x112 float16 x 2ch ~ 49 KB / frame. ShanghaiTech train (~275k frames, stride 1) ~ 13 GB.
# Raise frame_stride to 2 to halve storage.
compute_size: [320, 180]   # (W, H) used for cv2.calcOpticalFlowFarneback
store_size: [112, 112]     # (W, H) of the flow saved to .npz
frame_stride: 1

farneback:
  pyr_scale: 0.5
  levels: 3
  winsize: 15
  iterations: 3
  poly_n: 5
  poly_sigma: 1.2
  flags: 0

direction:
  grid: [8, 8]          # cells (rows, cols) for the direction histogram map
  bins: 8               # orientation bins (45 deg each)
  min_magnitude: 0.5    # px/frame (in compute_size space) below which motion is ignored
  # Counter-flow from flow: compare each cell's direction to that scene's dominant
  # direction learned on the (normal) training videos of the same camera.
  counterflow_cos: -0.5 # cos(angle) below this = going against the cell's dominant flow
