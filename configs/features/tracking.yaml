method: tracking

detector:
  weights: yolov8m.pt
  classes: [0]          # person
  imgsz: 1280
  conf: 0.10
  iou: 0.45
  tracker: bytetrack.yaml
  device: null          # null = auto (cuda if available)

# Rules that turn tracks into frame-level pseudo-labels (data/labels/tracking/...).
rules:
  velocity_lag: 5               # frames used for the instantaneous velocity vector
  min_speed: 0.02               # in units of box-heights per frame; slower = "not moving"

  loitering:
    window_sec: 3.0             # sliding window length
    # Radius is relative to the person's box height, so it works at any camera distance
    # (the notebook used a fixed 50 px, which breaks for far / near people).
    radius_box_heights: 0.6
    min_track_sec: 3.0

  counterflow:
    min_movers: 3               # need at least this many moving people to define "the flow"
    cos_threshold: -0.5         # cos(angle to crowd mean) below this = counter-flow
    min_frames: 5               # must persist this many consecutive frames

  # Frame label = 1 if any person is loitering or counter-flowing.
  # Frame score (0..1, used for AUC) = max over people of their rule scores.
  smooth_frames: 9              # median filter on the frame score
  label_threshold: 0.5
