# Model 4: MULDE improved (ours). Same method as configs/mulde.yaml; every change is marked [CHANGE].
# Weights: python -m src.models.nets download mulde_improved      Code: src/models/mulde.py
#   python -m src.train    --config configs/mulde_improved.yaml
#   python -m src.evaluate --config configs/mulde_improved.yaml

model:
  name: mulde_improved
  family: mulde
  clip_frames: 16
  frame_steps: [2, 4]          # [CHANGE] + a short clip (16 x 2 frames = 1.3 s): fast motion such as
                               #          running or counter-flow; the 16 x 4 features are shared with model 3
  train_stride: 4
  batch_clips: 8
  hidden: 2048                 # [CHANGE] lighter density network (2 x 2048 instead of 2 x 4096)

density:
  sigma_low: 1.0e-3
  sigma_high: 1.0
  levels: 16
  beta: 0.1
  lr: 1.0e-4
  adam_betas: [0.5, 0.9]
  batch_size: 2048
  iterations: 20000

scoring:
  gmm_components: 3
  per_scene: true              # [CHANGE] one model of "normal" per camera (ShanghaiTech: 13 cameras)
  smoothing_sigma: 7
